[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bybit-market-decision-system"
version = "0.1.0"
description = "Unified Bybit analytics platform: load, scan, levels, analyze"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "alembic>=1.13",
  "pandas>=2.2",
  "openpyxl>=3.1",
]

[project.scripts]
bybit-tool = "main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*", "docs*"]

[tool.ruff]
line-length = 100
